<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONIX</title>
    <style>
        :root {
            --bg: #111; --card-bg: #1a1a1a; --text: #fff; --input-bg: #fff; --input-text: #000;
            --accent: #007bff; --success: #28a745; --danger: #dc3545; --border: #444;
            --onix-red: #e63946;
        }
        body.light {
            --bg: #f4f4f4; --card-bg: #fff; --text: #111; --input-bg: #eee; --input-text: #000; --border: #ccc;
        }
        * { box-sizing: border-box; }
        body { 
            font-family: sans-serif; background: var(--bg); color: var(--text); 
            margin: 0; padding: 20px; transition: background 0.3s, color 0.3s; 
            display: flex; justify-content: center; align-items: flex-start; min-height: 100vh;
        }
        .container { 
            width: 100%; max-width: 480px; background: var(--card-bg); 
            padding: 25px; border-radius: 16px; box-shadow: 0 8px 30px rgba(0,0,0,0.4);
        }
        @media (min-width: 768px) {
            .container { max-width: 550px; padding: 35px; }
            body { padding: 40px 20px; }
        }
        
        h1.onix-title {
            color: var(--onix-red);
            font-size: 42px;
            letter-spacing: 4px;
            margin: 15px 0 5px 0;
            text-shadow: 0 0 20px rgba(230, 57, 70, 0.3);
        }
        p.onix-subtitle {
            color: var(--onix-red);
            font-size: 14px;
            margin: 0 0 25px 0;
            opacity: 0.85;
        }
        
        input, select, button { 
            margin: 8px 0; padding: 14px; border: none; border-radius: 10px; 
            width: 100%; box-sizing: border-box; font-size: 16px; 
            transition: all 0.2s ease;
        }
        input { background: var(--input-bg); color: var(--input-text); }
        button { background: var(--accent); color: white; cursor: pointer; font-weight: bold; }
        button:active { transform: scale(0.98); opacity: 0.9; }
        .success-btn { background: var(--success); }
        .danger-btn { background: var(--danger); }
        .hidden { display: none !important; }
        
        .service-item { 
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(128,128,128,0.1); padding: 12px; margin: 10px 0; 
            border-radius: 10px; text-align: left; gap: 10px;
            border: 1px solid var(--border);
        }
        .service-item .info { flex: 1; min-width: 0; }
        .service-item .info b { display: block; margin-bottom: 3px; }
        .service-item .info small { color: #888; word-break: break-all; }
        .service-item .pass-display { 
            font-family: monospace; color: var(--success); 
            word-break: break-all; font-size: 13px; margin-top: 5px;
            background: rgba(40, 167, 69, 0.1); padding: 3px 6px; border-radius: 4px;
        }
        .service-item .btn-group { display: flex; gap: 5px; flex-shrink: 0; }
        .service-item button { width: auto; padding: 8px 10px; margin: 0; font-size: 14px; }
        
        .theme-switcher, .lang-switcher { display: flex; justify-content: center; gap: 5px; margin-bottom: 10px; flex-wrap: wrap; }
        .theme-switcher button, .lang-switcher button { width: auto; padding: 6px 12px; font-size: 13px; border-radius: 20px; }
        
        #status { margin-top: 15px; font-size: 14px; color: #888; min-height: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="theme-switcher">
            <button onclick="setTheme('light')">☀️ Светлая</button>
            <button onclick="setTheme('dark')">🌙 Тёмная</button>
            <button onclick="setTheme('system')">💻 Системная</button>
        </div>
        <div class="lang-switcher">
            <button onclick="setLang('ru')">🇷🇺 RU</button>
            <button onclick="setLang('en')">🇬🇧 EN</button>
        </div>

        <!-- ЭКРАН ВХОДА -->
        <div id="loginScreen">
            <h1 class="onix-title">ONIX</h1>
            <p class="onix-subtitle" data-lang="subtitle">Твой безопасный сейф паролей</p>
            <input type="password" id="pinInput" data-lang="pinPlaceholder" placeholder="Введи пароль" maxlength="30" onkeydown="if(event.key==='Enter') tryLogin()">
            <button onclick="tryLogin()" data-lang="loginBtn">Войти</button>
            <button onclick="resetVault()" class="danger-btn" style="font-size:12px; background:transparent; color:#ff6b6b; border:1px solid #ff6b6b;" data-lang="resetBtn">Впервые? Сбросить всё</button>
            <div id="status"></div>
        </div>

        <!-- ГЛАВНЫЙ ЭКРАН -->
        <div id="vaultScreen" class="hidden">
            <h1 class="onix-title" style="font-size: 32px;">ONIX</h1>
            <p class="onix-subtitle" data-lang="subtitle">Твой безопасный сейф паролей</p>
            <input type="text" id="searchInput" data-lang="searchPlaceholder" placeholder="🔍 Поиск по сервису..." maxlength="30">
            <div id="vault"></div>
            <br>
            <button onclick="openAddForm()" data-lang="addBtn">+ Добавить сервис</button>
            <button onclick="saveToFile()" class="success-btn" data-lang="downloadBtn">💾 Скачать файл</button>
            <button onclick="logout()" style="background:#555;" data-lang="logoutBtn">Выйти</button>
            
            <div id="addForm" class="hidden">
                <input type="text" id="accName" data-lang="accNamePlaceholder" placeholder="Название сайта" maxlength="30">
                <input type="text" id="accLogin" data-lang="accLoginPlaceholder" placeholder="Логин или Номер" maxlength="30">
                <input type="text" id="accPass" data-lang="accPassPlaceholder" placeholder="Пароль" maxlength="30">
                <button onclick="addService()" data-lang="addServiceBtn">Добавить</button>
            </div>
        </div>
    </div>

    <script>
        let masterPin = localStorage.getItem('vault_pin') || "";
        let vaultData = JSON.parse(localStorage.getItem('vault_data') || "[]");
        let currentLang = localStorage.getItem('vault_lang') || 'ru';
        let revealedPasswords = new Set();

        const translations = {
            ru: {
                subtitle: "Твой безопасный сейф паролей",
                pinPlaceholder: "Введи пароль", loginBtn: "Войти",
                resetBtn: "Впервые? Сбросить всё",
                searchPlaceholder: "🔍 Поиск по сервису...", addBtn: "+ Добавить сервис",
                downloadBtn: "💾 Скачать файл", logoutBtn: "Выйти",
                accNamePlaceholder: "Название сайта", accLoginPlaceholder: "Логин или Номер",
                accPassPlaceholder: "Пароль", addServiceBtn: "Добавить",
                wrongPin: "❌ Неверный PIN!", pinSet: "✅ Ключ установлен! Войди снова.",
                fileDownloaded: "✅ Файл скачан!", noData: "❌ Нет данных.",
                emptyVault: "Пока пусто. Добавь первый сервис!",
                resetDone: "✅ Сброшено. Введи новый пароль.",
                resetCancel: "❌ Отменено.",
                resetConfirm: "Сбросить все данные? Напиши 'ДА' в поле пароля."
            },
            en: {
                subtitle: "Your safe password vault",
                pinPlaceholder: "Enter password", loginBtn: "Login",
                resetBtn: "First time? Reset all",
                searchPlaceholder: "🔍 Search service...", addBtn: "+ Add service",
                downloadBtn: "💾 Download file", logoutBtn: "Logout",
                accNamePlaceholder: "Service name", accLoginPlaceholder: "Login or Number",
                accPassPlaceholder: "Password", addServiceBtn: "Add",
                wrongPin: "❌ Wrong PIN!", pinSet: "✅ Key set! Login again.",
                fileDownloaded: "✅ File downloaded!", noData: "❌ No data.",
                emptyVault: "Empty. Add your first service!",
                resetDone: "✅ Reset done. Enter new password.",
                resetCancel: "❌ Cancelled.",
                resetConfirm: "Reset all data? Type 'YES' in password field."
            }
        };

        function setLang(lang) {
            currentLang = lang;
            localStorage.setItem('vault_lang', lang);
            document.querySelectorAll('[data-lang]').forEach(el => {
                const key = el.getAttribute('data-lang');
                if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') {
                    el.placeholder = translations[lang][key];
                } else {
                    el.textContent = translations[lang][key];
                }
            });
        }

        function setTheme(theme) {
            localStorage.setItem('vault_theme', theme);
            applyTheme(theme);
        }
        function applyTheme(theme) {
            if (theme === 'light') document.body.classList.add('light');
            else if (theme === 'dark') document.body.classList.remove('light');
            else if (theme === 'system') {
                if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
                    document.body.classList.add('light');
                } else {
                    document.body.classList.remove('light');
                }
            }
        }
        window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => {
            if (localStorage.getItem('vault_theme') === 'system') applyTheme('system');
        });

        function tryLogin() {
            const pin = document.getElementById('pinInput').value.trim();
            if (pin.length < 1) return;
            
            if (masterPin === "") {
                masterPin = pin;
                localStorage.setItem('vault_pin', masterPin);
                document.getElementById('status').innerText = translations[currentLang].pinSet;
                document.getElementById('pinInput').value = '';
                return;
            }
            
            if (pin === masterPin) {
                showVault();
            } else {
                document.getElementById('status').innerText = translations[currentLang].wrongPin;
            }
        }

        function resetVault() {
            let confirmText = prompt(translations[currentLang].resetConfirm);
            if (confirmText && (confirmText.toUpperCase() === 'ДА' || confirmText.toUpperCase() === 'YES')) {
                localStorage.removeItem('vault_pin');
                localStorage.removeItem('vault_data');
                masterPin = "";
                vaultData = [];
                revealedPasswords.clear();
                document.getElementById('pinInput').value = '';
                document.getElementById('status').innerText = translations[currentLang].resetDone;
            } else {
                document.getElementById('status').innerText = translations[currentLang].resetCancel;
            }
        }

        function logout() {
            document.getElementById('vaultScreen').classList.add('hidden');
            document.getElementById('loginScreen').classList.remove('hidden');
            document.getElementById('pinInput').value = '';
            document.getElementById('status').innerText = "";
            revealedPasswords.clear();
        }

        function showVault() {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('vaultScreen').classList.remove('hidden');
            renderList();
        }

        document.getElementById('searchInput').addEventListener('input', renderList);

        function openAddForm() {
            document.getElementById('addForm').classList.toggle('hidden');
        }

        function addService() {
            let service = document.getElementById('accName').value.trim();
            let login = document.getElementById('accLogin').value.trim();
            let pass = document.getElementById('accPass').value.trim();
            if (!service || !login || !pass) return;
            
            vaultData.push({ service, login, pass });
            localStorage.setItem('vault_data', JSON.stringify(vaultData));
            
            document.getElementById('accName').value = '';
            document.getElementById('accLogin').value = '';
            document.getElementById('accPass').value = '';
            openAddForm();
            renderList();
        }

        function renderList() {
            let search = document.getElementById('searchInput').value.toLowerCase();
            let html = "";
            
            if (vaultData.length === 0) {
                html = `<p style='text-align:center;'>${translations[currentLang].emptyVault}</p>`;
            } else {
                for (let i = 0; i < vaultData.length; i++) {
                    let item = vaultData[i];
                    if (item.service.toLowerCase().includes(search) || item.login.toLowerCase().includes(search)) {
                        let count = 0;
                        for (let j = 0; j < vaultData.length; j++) {
                            if (vaultData[j].service.toLowerCase() === item.service.toLowerCase()) count++;
                        }
                        let ext = count > 1 ? `<span style="color: #888; font-size: 12px;">+${count - 1}</span>` : "";
                        
                        let passDisplay = revealedPasswords.has(i) 
                            ? `<div class="pass-display">🔑 ${item.pass}</div>` 
                            : '';
                        
                        html += `<div class="service-item">
                                    <div class="info">
                                        <b>${item.service} ${ext}</b>
                                        <small>👤 ${item.login}</small>
                                        ${passDisplay}
                                    </div>
                                    <div class="btn-group">
                                        <button onclick="togglePass(${i})" style="background:#007bff;">${revealedPasswords.has(i) ? '🙈' : '👁'}</button>
                                        <button onclick="deleteService(${i})" style="background:#dc3545;">✖</button>
                                    </div>
                                </div>`;
                    }
                }
            }
            document.getElementById('vault').innerHTML = html;
        }

        function togglePass(index) {
            if (revealedPasswords.has(index)) {
                revealedPasswords.delete(index);
            } else {
                revealedPasswords.add(index);
            }
            renderList();
        }

        function deleteService(index) {
            vaultData.splice(index, 1);
            localStorage.setItem('vault_data', JSON.stringify(vaultData));
            revealedPasswords.clear();
            renderList();
        

        function saveToFile() {
            if (vaultData.length === 0) {
                document.getElementById('status').innerText = translations[currentLang].noData;
                return;
            }
            // Красивый текстовый формат
            let textOutput = "";
            for (let i = 0; i < vaultData.length; i++) {
                textOutput += `Сервис: ${vaultData[i].service}\n`;
                textOutput += `Логин: ${vaultData[i].login}\n`;
                textOutput += `Пароль: ${vaultData[i].pass}\n\n\n`;
            }
            
            let blob = new Blob([textOutput], { type: 'text/plain' });
            let url = URL.createObjectURL(blob);
            let a = document.createElement('a');
            a.href = url;
            a.download = "vault_backup.txt";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            document.getElementById('status').innerText = translations[currentLang].fileDownloaded;
        }

        setLang(currentLang);
        applyTheme(localStorage.getItem('vault_theme') || 'system');
    </script>
</body>
</html>э
